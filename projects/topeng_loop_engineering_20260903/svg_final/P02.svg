    </text>

    <line x1="477" y1="265" x2="797" y2="265" stroke="#334155" stroke-width="1" />

    <text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="477" y="300">
      <tspan>• Codex/Operator: Xuất sắc kết nối API &amp;</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="477" y="324"><tspan>thao tác trình duyệt web tự động.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="477" y="348"><tspan>• Claude 3.7: Dẫn đầu tư duy suy luận sâu</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="477" y="372"><tspan>(Extended Thinking) &amp; thao tác CLI.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="477" y="396"><tspan>• DeepMind Antigravity: Đỉnh cao điều phối</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="477" y="420"><tspan>đa tác tử song song và quản trị an toàn.</tspan>
    </text><rect x="477" y="535" width="325" height="40" rx="8" fill="#0B1120" stroke="#6366F1" stroke-width="1" />
    <text x="639" y="560" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#818CF8" text-anchor="middle">Chiến lược: Không bị trói buộc vào một hãng</text>

    
    <rect x="859" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
    <rect x="879" y="180" width="40" height="40" rx="10" fill="#0B1120" stroke="#10B981" stroke-width="1.5" />

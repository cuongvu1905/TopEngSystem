    <text x="879" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#10B981">
      Trợ Lý Doanh Nghiệp Thực Chiến
    </text>

    <line x1="879" y1="265" x2="1199" y2="265" stroke="#334155" stroke-width="1" />

    <text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="879" y="300">
      <tspan>• Đang vận hành trong TopEngManager:</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="879" y="324"><tspan>Đặt phòng, điều phối task, tạo báo cáo ngày.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="879" y="348"><tspan>• Tích hợp n8n webhook liên kết email, lịch.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="879" y="372"><tspan>• Lộ trình 2026-2027: 4 Trụ cột chiến lược</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="879" y="396"><tspan>RAG bản vẽ → Multi-Agent → Voice → ERP.</tspan>
    </text><rect x="879" y="535" width="325" height="40" rx="8" fill="#0B1120" stroke="#10B981" stroke-width="1" />

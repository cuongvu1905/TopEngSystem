      Từ Prompt Thụ Động sang Tự Chủ Khép Kín
    </text>

    <line x1="76" y1="265" x2="396" y2="265" stroke="#334155" stroke-width="1" />

    <text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="300">
      <tspan>• Copilot chỉ dừng ở gợi ý code một lần,</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="324"><tspan>lập trình viên vẫn phải tự test và sửa lỗi.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="348"><tspan>• Loop Engineering trao cho Agent khả năng</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="372"><tspan>chạy lệnh terminal, đọc log và tự vá lỗi.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="396"><tspan>• Chuẩn hóa văn hóa "Verification-First":</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="420"><tspan>Mọi tính năng phải có bằng chứng log thật.</tspan>
    </text><rect x="76" y="535" width="325" height="40" rx="8" fill="#0B1120" stroke="#38BDF8" stroke-width="1" />
    <text x="238" y="560" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#38BDF8" text-anchor="middle">Hiệu quả: Giảm 80% thời gian debug lặp lại</text>

    
    <rect x="457" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4" />
    <rect x="477" y="180" width="40" height="40" rx="10" fill="#0B1120" stroke="#6366F1" stroke-width="1.5" />

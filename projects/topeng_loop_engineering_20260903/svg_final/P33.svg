    <text x="686" y="500" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Bảo Mật Dữ Liệu Theo Vai Trò (RBAC)</text>
    <line x1="686" y1="520" x2="1180" y2="520" stroke="#334155" stroke-width="1" />
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="686" y="550">
      <tspan>Phân quyền nghiêm ngặt dựa theo hồ sơ người dùng (currentUser),</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="686" y="572"><tspan>không xảy ra bất kỳ sự cố rò rỉ thông tin mật hay vượt quyền truy cập.</tspan>
    </text></g>

  

  <g id="report-n8n-grid" data-pptx-bounds="56 160 1168 450">
    
    <rect x="56" y="160" width="568" height="440" rx="16" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
    <rect x="76" y="180" width="200" height="28" rx="6" fill="#78350F" stroke="#F59E0B" stroke-width="1" />

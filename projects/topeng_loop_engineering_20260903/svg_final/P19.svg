    <text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="295">
      <tspan fill="#FBBF24" font-weight="600">• Suy nghĩ trước khi phản hồi:</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="96" y="315"><tspan>AI tự viết ra chuỗi suy luận phân tích rủi ro trong khối hidden thinking.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="343"><tspan fill="#FBBF24" font-weight="600">• Linh hoạt ngân sách suy nghĩ:</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="96" y="363"><tspan>Điều chỉnh Thinking Budget từ 1K đến hàng chục nghìn tokens tùy độ khó.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="391"><tspan fill="#FBBF24" font-weight="600">• Tự phản biện giả thuyết:</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="96" y="411"><tspan>Tự tìm ra lỗ hổng trong phương án A để chuyển sang phương án B tối ưu.</tspan>
    </text><rect x="457" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />

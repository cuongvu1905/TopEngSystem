    <text x="557" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7DD3FC" text-anchor="middle">ĐỈNH CAO CODING</text>
    <text x="477" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">SWE-bench Verified</text>

    <line x1="477" y1="260" x2="797" y2="260" stroke="#334155" stroke-width="1" />

    <text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="477" y="295">
      <tspan fill="#38BDF8" font-weight="600">• Dẫn đầu bài test kỹ thuật thực tế:</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="497" y="315"><tspan>Giải quyết thành công hơn 70% các issue GitHub phức tạp ngoài đời thực.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="477" y="343"><tspan fill="#38BDF8" font-weight="600">• Bắt trọn các điều kiện biên (Edge cases):</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="497" y="363"><tspan>Cực kỳ cẩn trọng với các lỗi null pointer, race conditions, memory leaks.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="477" y="391"><tspan fill="#38BDF8" font-weight="600">• Phong cách code sạch (Clean Code):</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="497" y="411"><tspan>Viết code có cấu trúc chặt chẽ, chú thích sáng sủa và dễ bảo trì.</tspan>
    </text><rect x="859" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />

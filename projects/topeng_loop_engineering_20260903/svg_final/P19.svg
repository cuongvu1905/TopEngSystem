    <text x="879" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Độ Chính Xác Tuyệt Đối</text>

    <line x1="879" y1="260" x2="1199" y2="260" stroke="#334155" stroke-width="1" />

    <text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="879" y="295">
      <tspan fill="#10B981" font-weight="600">• Tiếp nhận toàn bộ repository:</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="899" y="315"><tspan>Đọc hiểu hàng chục file mã nguồn</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="899" y="335"><tspan>mà không bị suy giảm trí nhớ.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="879" y="361"><tspan fill="#10B981" font-weight="600">• "Needle In A Haystack" 99%:</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="899" y="381"><tspan>Tìm chính xác 1 dòng code ẩn sâu</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="899" y="401"><tspan>trong hàng nghìn trang tài liệu.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="879" y="427"><tspan fill="#10B981" font-weight="600">• Constitutional AI an toàn:</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="899" y="447"><tspan>Hạn chế tối đa hành vi phá hoại</tspan>

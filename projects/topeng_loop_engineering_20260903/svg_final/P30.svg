    <text x="176" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">PHẦN III: AI CHAT TOPVSYSTEM</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">CƠ CHẾ DYNAMIC MULTI-BRAIN: ĐỘC LẬP &amp; TỐI ƯU</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Cách TOPVSystem luân chuyển linh hoạt giữa các nhà cung cấp AI để cân bằng chi phí và chất lượng</text>
  </g>

  
  <g id="multibrain-panels" data-pptx-bounds="56 160 1168 450">
    
    <rect x="56" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
    <rect x="76" y="180" width="160" height="28" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1" />
    <text x="156" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#34D399" text-anchor="middle">CHIẾN LƯỢC ĐỘC LẬP</text>
    <text x="76" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Vendor-Agnostic Design</text>

    <line x1="76" y1="260" x2="396" y2="260" stroke="#334155" stroke-width="1" />

    <text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="295">
      <tspan fill="#34D399" font-weight="600">• Không gắn cứng vào 1 hãng AI:</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="96" y="315"><tspan>Mã nguồn route.js trừu tượng hóa tầng giao tiếp.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="343"><tspan fill="#34D399" font-weight="600">• Cơ chế dự phòng nóng (Hot Failover):</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="96" y="363"><tspan>Nếu OpenAI bị lỗi 503, tự động chuyển sang Claude hoặc Gemini.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="391"><tspan fill="#34D399" font-weight="600">• Bảo đảm tính liên tục (High Availability):</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="96" y="411"><tspan>Doanh nghiệp không bao giờ bị tê liệt khi 1 nhà cung cấp sập.</tspan>
    </text><rect x="457" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <rect x="477" y="180" width="160" height="28" rx="6" fill="#075985" stroke="#38BDF8" stroke-width="1" />

  <g id="six-steps-grid" data-pptx-bounds="56 160 1168 450">
    
    
    <rect x="56" y="160" width="365" height="205" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="90" cy="195" r="18" fill="#0B1120" stroke="#38BDF8" stroke-width="2" />
    <text x="90" y="201" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">1</text>
    <text x="125" y="201" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">Phân Tích (Analyze)</text>
    <line x1="76" y1="225" x2="396" y2="225" stroke="#334155" stroke-width="1" />
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="76" y="255">
      <tspan>• Tiếp nhận Issue, Bug Report hoặc Yêu cầu tính năng.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="76" y="277"><tspan>• Đọc lướt và tìm kiếm codebase qua grep/find tools.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="76" y="299"><tspan>• Xác định chính xác phạm vi và ranh giới tác động.</tspan>
    </text><rect x="457" y="160" width="365" height="205" rx="14" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="491" cy="195" r="18" fill="#0B1120" stroke="#6366F1" stroke-width="2" />
    <text x="491" y="201" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#818CF8" text-anchor="middle">2</text>
    <text x="526" y="201" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">Lập Kế Hoạch (Plan)</text>
    <line x1="477" y1="225" x2="797" y2="225" stroke="#334155" stroke-width="1" />
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="477" y="255">
      <tspan>• Soạn thảo Implementation Plan có cấu trúc rõ ràng.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="477" y="277"><tspan>• Liệt kê các file [NEW], [MODIFY], [DELETE].</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="477" y="299"><tspan>• Xác định kế hoạch kiểm chứng (Verification Plan) trước.</tspan>
    </text><rect x="859" y="160" width="365" height="205" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="893" cy="195" r="18" fill="#0B1120" stroke="#10B981" stroke-width="2" />
    <text x="893" y="201" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">3</text>
    <text x="928" y="201" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">Thực Thi Mã (Act)</text>
    <line x1="879" y1="225" x2="1199" y2="225" stroke="#334155" stroke-width="1" />
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="879" y="255">
      <tspan>• Trực tiếp can thiệp mã qua replace_file_content.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="879" y="277"><tspan>• Tuân thủ nghiêm ngặt quy chuẩn kiến trúc hiện có.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="879" y="299"><tspan>• Tránh chỉnh sửa tùy tiện những đoạn mã không liên quan.</tspan>
    </text><rect x="56" y="385" width="365" height="215" rx="14" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="90" cy="420" r="18" fill="#0B1120" stroke="#F59E0B" stroke-width="2" />
    <text x="90" y="426" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FBBF24" text-anchor="middle">4</text>
    <text x="125" y="426" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">Kiểm Chứng (Verify)</text>
    <line x1="76" y1="450" x2="396" y2="450" stroke="#334155" stroke-width="1" />
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="76" y="480">
      <tspan>• Chạy lệnh kiểm thử terminal (pytest, npm test).</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="76" y="502"><tspan>• Chạy linter, format code, type-checkers.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="76" y="524"><tspan>• Lấy Exit Code thực tế của hệ điều hành làm tiêu chuẩn.</tspan>
    </text><rect x="457" y="385" width="365" height="215" rx="14" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="491" cy="420" r="18" fill="#0B1120" stroke="#EC4899" stroke-width="2" />
    <text x="491" y="426" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#F472B6" text-anchor="middle">5</text>
    <text x="526" y="426" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">Quan Sát (Observe)</text>
    <line x1="477" y1="450" x2="797" y2="450" stroke="#334155" stroke-width="1" />
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="477" y="480">
      <tspan>• Phân tích kỹ output log từ stdout và stderr.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="477" y="502"><tspan>• Phát hiện stack trace, ngoại lệ hoặc test regressions.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="477" y="524"><tspan>• Đánh giá xem kết quả có đúng kỳ vọng hay còn sai lệch.</tspan>
    </text><rect x="859" y="385" width="365" height="215" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="893" cy="420" r="18" fill="#0B1120" stroke="#38BDF8" stroke-width="2" />
    <text x="893" y="426" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">6</text>
    <text x="928" y="426" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">Tự Sửa Lỗi (Refine)</text>
    <line x1="879" y1="450" x2="1199" y2="450" stroke="#334155" stroke-width="1" />
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="879" y="480">
      <tspan>• Nếu có lỗi: Tự phân tích và quay lại Step 3 để vá.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="879" y="502"><tspan>• Lặp lại tuần hoàn cho đến khi 100% test đều Pass.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="879" y="524"><tspan>• Khi thành công: Soạn Walkthrough và tạo Commit.</tspan>
    </text></g>

  

  <g id="header-group" data-pptx-bounds="56 40 1168 100">
    <rect x="56" y="40" width="260" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    <text x="186" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">PHẦN I: KHÁI NIỆM &amp; NGUYÊN LÝ</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">LOOP ENGINEERING LÀM GÌ? QUY TRÌNH 6 BƯỚC KHÉP KÍN</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Chi tiết hóa từng giai đoạn trong chu trình tự động giải quyết trọn vẹn một bài toán kỹ thuật</text>

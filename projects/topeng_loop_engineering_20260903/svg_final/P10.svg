<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#0D1527" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)" />

  
  <g id="header-group" data-pptx-bounds="56 40 1168 100">
    <rect x="56" y="40" width="260" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
    <text x="186" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">PHẦN I: KHÁI NIỆM &amp; NGUYÊN LÝ</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">LOOP ENGINEERING LÀ GÌ? ĐỊNH NGHĨA KỸ NGHỆ</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Hai góc nhìn bổ trợ: Từ nền tảng lý thuyết điều khiển học đến thực tiễn kỹ thuật phần mềm</text>
  </g>

  
  <g id="definitions-grid" data-pptx-bounds="56 160 1168 450">
    
    <rect x="56" y="160" width="568" height="440" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <rect x="76" y="180" width="180" height="28" rx="6" fill="#075985" stroke="#38BDF8" stroke-width="1" />
    <text x="166" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7DD3FC" text-anchor="middle">ĐỊNH NGHĨA HỌC THUẬT</text>
    <text x="76" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#F1F5F9">Closed-Loop Cybernetics</text>

    <line x1="76" y1="260" x2="604" y2="260" stroke="#334155" stroke-width="1" />

    <text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="295">
      <tspan fill="#38BDF8" font-weight="600">Bản chất điều khiển học (Cybernetics):</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="319"><tspan>Là phân nhánh kỹ nghệ phần mềm nghiên cứu việc tích hợp</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="341"><tspan>mô hình AI vào các vòng lặp phản hồi đóng (Closed-Loop),</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="363"><tspan>nơi tác tử tự quan sát trạng thái môi trường (State Perception),</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="385"><tspan>ra quyết định hành động (Action) và nhận phản hồi thực tế</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="76" y="407"><tspan>để tự hoàn thành mục tiêu mà không cần con người can thiệp.</tspan>
    </text><rect x="76" y="440" width="528" height="135" rx="10" fill="#0B1120" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
    <text x="96" y="468" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">Bước tiến hóa Software 3.0:</text>
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="96" y="495">
      <tspan>• Software 1.0: Con người gõ từng dòng lệnh logic (Rules).</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="96" y="517"><tspan>• Software 2.0: Huấn luyện trọng số mạng nơ-ron (Neural Nets).</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="96" y="539"><tspan>• Software 3.0 / Loop: Agent tự vận hành và sửa mã qua vòng lặp.</tspan>
    </text><rect x="656" y="160" width="568" height="440" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
    <rect x="676" y="180" width="180" height="28" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1" />
    <text x="766" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#34D399" text-anchor="middle">KHÁI NIỆM THỰC TIỄN</text>
    <text x="676" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#F1F5F9">Kỹ Nghệ Trong Thực Tế</text>

    <line x1="676" y1="260" x2="1204" y2="260" stroke="#334155" stroke-width="1" />

    <text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="676" y="295">
      <tspan fill="#10B981" font-weight="600">Loop Engineering diễn ra như thế nào?</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="676" y="319"><tspan>• Được cấp công cụ thật: Truy cập Shell, File system, Linter, Git.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="676" y="343"><tspan>• Nhận Goal thay vì Prompt đơn lẻ:</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="696" y="363"><tspan>"Sửa bug #104 và đảm bảo pass 100% tests" thay vì chỉ hỏi code.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="676" y="389"><tspan>• Vòng lặp dừng khi đạt tiêu chuẩn nghiệm thu:</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8" x="696" y="409"><tspan>Chỉ bàn giao khi lệnh kiểm thử thực tế trả về Exit Code = 0.</tspan>
    </text><rect x="676" y="440" width="528" height="135" rx="10" fill="#0B1120" stroke="#10B981" stroke-width="1" stroke-opacity="0.3" />
    <text x="696" y="468" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981">Giá trị sống còn đối với kỹ sư:</text>
    <text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="696" y="495">
      <tspan>• Xóa bỏ hoàn toàn gánh nặng copy-paste log lỗi thủ công.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="696" y="517"><tspan>• Đảm bảo mã nguồn trước khi merge đã được máy tính kiểm chứng.</tspan>
      </text><text font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8" x="696" y="539"><tspan>• Kỹ sư chuyển vai trò từ "Thợ gõ code" sang "Kiến trúc sư hệ thống".</tspan>
    </text></g>

  

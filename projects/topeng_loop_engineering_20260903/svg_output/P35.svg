<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Page Header -->
  <g id="header-group" data-pptx-bounds="56 40 1168 100">
    <rect x="56" y="40" width="220" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="166" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">KẾT LUẬN &amp; TỔNG KẾT</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">TỔNG KẾT TẦM NHÌN, HÀNH ĐỘNG &amp; HỎI ĐÁP (Q&amp;A)</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Khẳng định cam kết tiên phong chuyển đổi số toàn diện của TOPVSystem trong kỷ nguyên AI tự chủ</text>
  </g>

  <!-- 3 Summary Panels -->
  <g id="summary-panels" data-pptx-bounds="56 160 1168 450">
    <!-- Panel 1: Key Takeaways -->
    <rect x="56" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="76" y="180" width="160" height="28" rx="6" fill="#075985" stroke="#38BDF8" stroke-width="1"/>
    <text x="156" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7DD3FC" text-anchor="middle">3 THÔNG ĐIỆP CHÍNH</text>
    <text x="76" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Trọng Tâm Chiến Lược</text>

    <line x1="76" y1="260" x2="396" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="76" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="76" dy="0" fill="#38BDF8" font-weight="600">1. Loop Engineering là Software 3.0:</tspan>
      <tspan x="96" dy="20">Vòng lặp tự chủ khép kín thay thế hoàn toàn mô hình prompt thụ động.</tspan>
      <tspan x="76" dy="28" fill="#38BDF8" font-weight="600">2. Tinh hoa đa mô hình (Multi-Brain):</tspan>
      <tspan x="96" dy="20">Kết hợp tư duy Claude, công cụ OpenAI và kỷ luật tự sửa lỗi Antigravity.</tspan>
      <tspan x="76" dy="28" fill="#38BDF8" font-weight="600">3. Thực chiến tại TOPVSystem:</tspan>
      <tspan x="96" dy="20">AI tạo giá trị thực qua dữ liệu thật MySQL và tự động hóa quy trình n8n.</tspan>
    </text>

    <!-- Panel 2: Action Items -->
    <rect x="457" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="477" y="180" width="160" height="28" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="557" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#34D399" text-anchor="middle">KẾ HOẠCH HÀNH ĐỘNG</text>
    <text x="477" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">3 Bước Triển Khai Ngay</text>

    <line x1="477" y1="260" x2="797" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="477" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="477" dy="0" fill="#34D399" font-weight="600">• Bước 1: RAG Bản Vẽ CAD/BIM:</tspan>
      <tspan x="497" dy="20">Triển khai vector pipeline đọc hiểu bản vẽ kỹ thuật trong Q3/2026.</tspan>
      <tspan x="477" dy="28" fill="#34D399" font-weight="600">• Bước 2: Đào tạo kỹ sư chuyên sâu:</tspan>
      <tspan x="497" dy="20">Nâng cao kỹ năng phối hợp cùng AI Agent cho toàn bộ nhân sự công ty.</tspan>
      <tspan x="477" dy="28" fill="#34D399" font-weight="600">• Bước 3: Chuẩn hóa kho tri thức:</tspan>
      <tspan x="497" dy="20">Xây dựng Knowledge Base tập trung phục vụ tra cứu tự động.</tspan>
    </text>

    <!-- Panel 3: Q&A -->
    <rect x="859" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="879" y="180" width="160" height="28" rx="6" fill="#3730A3" stroke="#6366F1" stroke-width="1"/>
    <text x="959" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#A5B4FC" text-anchor="middle">PHIÊN THẢO LUẬN</text>
    <text x="879" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Hỏi Đáp &amp; Giao Lưu</text>

    <line x1="879" y1="260" x2="1199" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="879" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="879" dy="0" fill="#818CF8" font-weight="600">• Trân trọng cảm ơn Quý vị:</tspan>
      <tspan x="899" dy="20">Ban Lãnh đạo, Quý đối tác</tspan>
      <tspan x="899" dy="20">và toàn thể đội ngũ kỹ sư TOPV.</tspan>
      <tspan x="879" dy="26" fill="#818CF8" font-weight="600">• Thảo luận chuyên sâu:</tspan>
      <tspan x="899" dy="20">1. Kiến trúc Multi-Brain.</tspan>
      <tspan x="899" dy="20">2. Tích hợp sâu ERP/MES.</tspan>
      <tspan x="899" dy="20">3. Triển khai thực địa công trường.</tspan>
    </text>

    <rect x="879" y="475" width="320" height="95" rx="10" fill="#0B1120" stroke="#6366F1" stroke-width="1"/>
    <text x="1039" y="515" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#F1F5F9" text-anchor="middle">THANK YOU!</text>
    <text x="1039" y="545" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#38BDF8" text-anchor="middle">TOPVSystem Engineering • 2026</text>
  </g>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="section">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Decorative Rings -->
  <g id="decor-rings" data-pptx-bounds="850 120 350 350">
    <circle cx="1025" cy="295" r="160" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="1025" cy="295" r="120" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8,6" stroke-opacity="0.4"/>
    <circle cx="1025" cy="295" r="70" fill="#0F172A" stroke="#6366F1" stroke-width="2" stroke-opacity="0.5"/>
    <text x="1025" y="303" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="bold" fill="#38BDF8" text-anchor="middle">PART 1</text>
  </g>

  <!-- Section Hero Box -->
  <g id="section-hero" data-pptx-bounds="100 180 800 360">
    <rect x="100" y="180" width="150" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="175" y="202" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">PHẦN THỨ NHẤT</text>

    <text x="100" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="bold" fill="#F1F5F9">
      <tspan x="100" dy="0">LỊCH SỬ TIẾN HÓA &amp;</tspan>
      <tspan x="100" dy="54" fill="#38BDF8">LOOP ENGINEERING LÀ GÌ?</tspan>
    </text>

    <rect x="100" y="360" width="500" height="3" fill="url(#glowGrad)"/>

    <text x="100" y="410" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">
      <tspan x="100" dy="0">Hành trình 5 thập kỷ SDLC từ phát triển tuần tự đến kỷ nguyên tự chủ khép kín,</tspan>
      <tspan x="100" dy="28">chu trình OODA, Ralph Loop và 4 nguyên lý kỹ thuật cốt lõi bất biến.</tspan>
    </text>

    <rect x="100" y="480" width="360" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="280" y="506" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#38BDF8" text-anchor="middle">
      Gồm 11 chuyên đề chuyên sâu (P04 → P14)
    </text>
  </g>

  <!-- Footer Navigation -->
  <g id="footer-group" data-pptx-bounds="56 645 1168 30">
    <line x1="56" y1="635" x2="1224" y2="635" stroke="#1E293B" stroke-width="1"/>
    <text x="56" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748B">Phần I: Lịch sử &amp; Bản chất Loop Engineering | Mở đầu phân đoạn</text>
    <text x="1224" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="end">SLIDE 04 / 35</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Page Header -->
  <g id="header-group" data-pptx-bounds="56 40 1168 100">
    <rect x="56" y="40" width="230" height="26" rx="13" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="171" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">PHẦN II: CÁC MÔ HÌNH AI AGENT</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">OPENAI CODEX &amp; ASSISTANTS API: TIÊN PHONG FUNCTION CALLING</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Di sản công nghệ định hình chuẩn kết nối công cụ có cấu trúc cho toàn bộ ngành công nghiệp</text>
  </g>

  <!-- 3 Detailed Column Panels -->
  <g id="codex-panels" data-pptx-bounds="56 160 1168 450">
    <!-- Panel 1 -->
    <rect x="56" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="76" y="180" width="160" height="28" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="156" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#34D399" text-anchor="middle">TIẾN HÓA MÔ HÌNH</text>
    <text x="76" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Từ Codex Đến GPT-4o</text>

    <line x1="76" y1="260" x2="396" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="76" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="76" dy="0" fill="#34D399" font-weight="600">• Khởi nguyên OpenAI Codex (2021):</tspan>
      <tspan x="96" dy="20">Mô hình đầu tiên chứng minh LLM hiểu sâu sắc cú pháp lập trình.</tspan>
      <tspan x="76" dy="28" fill="#34D399" font-weight="600">• Động cơ của GitHub Copilot:</tspan>
      <tspan x="96" dy="20">Mở ra làn sóng hỗ trợ lập trình hàng loạt trên toàn cầu.</tspan>
      <tspan x="76" dy="28" fill="#34D399" font-weight="600">• Tích hợp vào GPT-4o hiện đại:</tspan>
      <tspan x="96" dy="20">Xử lý đồng thời mã nguồn, tài liệu, hình ảnh và âm thanh.</tspan>
    </text>

    <!-- Panel 2 -->
    <rect x="457" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="477" y="180" width="160" height="28" rx="6" fill="#075985" stroke="#38BDF8" stroke-width="1"/>
    <text x="557" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7DD3FC" text-anchor="middle">CHUẨN CÔNG CỤ</text>
    <text x="477" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Function Calling Chuẩn</text>

    <line x1="477" y1="260" x2="797" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="477" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="477" dy="0" fill="#38BDF8" font-weight="600">• Chuẩn hóa qua JSON Schema:</tspan>
      <tspan x="497" dy="20">Agent nhận danh sách hàm kèm mô tả tham số nghiêm ngặt.</tspan>
      <tspan x="477" dy="28" fill="#38BDF8" font-weight="600">• Structured Outputs (100% JSON):</tspan>
      <tspan x="497" dy="20">Loại bỏ lỗi cú pháp JSON parse error, đảm bảo an toàn tuyệt đối.</tspan>
      <tspan x="477" dy="28" fill="#38BDF8" font-weight="600">• Biến LLM thành bộ điều khiển:</tspan>
      <tspan x="497" dy="20">Tự quyết định khi nào gọi hàm, trích xuất đúng tham số.</tspan>
    </text>

    <!-- Panel 3 -->
    <rect x="859" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="879" y="180" width="160" height="28" rx="6" fill="#3730A3" stroke="#6366F1" stroke-width="1"/>
    <text x="959" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#A5B4FC" text-anchor="middle">HẠ TẦNG ASSISTANTS</text>
    <text x="879" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Quản Trị Luồng Tác Tử</text>

    <line x1="879" y1="260" x2="1199" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="879" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="879" dy="0" fill="#818CF8" font-weight="600">• Quản lý Threads &amp; Runs tự động:</tspan>
      <tspan x="899" dy="20">Lưu vết phiên làm việc trên Cloud,</tspan>
      <tspan x="899" dy="20">không lo tràn bộ nhớ cục bộ.</tspan>
      <tspan x="879" dy="26" fill="#818CF8" font-weight="600">• 3 Công cụ gốc tích hợp sẵn:</tspan>
      <tspan x="899" dy="20">Code Interpreter, File Search</tspan>
      <tspan x="899" dy="20">và Function Calling có cấu trúc.</tspan>
      <tspan x="879" dy="26" fill="#818CF8" font-weight="600">• Ứng dụng rộng rãi nhất:</tspan>
      <tspan x="899" dy="20">Nền tảng phổ biến nhất cho việc</tspan>
      <tspan x="899" dy="20">xây dựng chatbot &amp; Agent SaaS.</tspan>
    </text>
  </g>

  <!-- Footer Navigation -->
  <g id="footer-group" data-pptx-bounds="56 645 1168 30">
    <line x1="56" y1="635" x2="1224" y2="635" stroke="#1E293B" stroke-width="1"/>
    <text x="56" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748B">Phần II: Các mô hình AI Agent | 2.2 OpenAI Codex &amp; Assistants</text>
    <text x="1224" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="end">SLIDE 17 / 35</text>
  </g>
</svg>

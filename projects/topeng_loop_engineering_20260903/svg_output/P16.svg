<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Page Header -->
  <g id="header-group" data-pptx-bounds="56 40 1168 100">
    <rect x="56" y="40" width="230" height="26" rx="13" fill="#1E293B" stroke="#818CF8" stroke-width="1"/>
    <text x="171" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#818CF8" text-anchor="middle">PHẦN II: CÁC MÔ HÌNH AI AGENT</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">PHÂN LOẠI KIẾN TRÚC: SINGLE-AGENT VS MULTI-AGENT</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Hai trường phái thiết kế tác tử giải quyết bài toán quy mô và độ phức tạp phần mềm</text>
  </g>

  <!-- 2 Architecture Paradigm Panels -->
  <g id="arch-panels" data-pptx-bounds="56 160 1168 450">
    <!-- Left: Single-Agent -->
    <rect x="56" y="160" width="568" height="440" rx="16" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="76" y="180" width="180" height="28" rx="6" fill="#78350F" stroke="#F59E0B" stroke-width="1"/>
    <text x="166" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#FBBF24" text-anchor="middle">TRƯỜNG PHÁI 1</text>
    <text x="76" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#F1F5F9">Single-Agent (Đơn Tác Tử)</text>

    <line x1="76" y1="260" x2="604" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="76" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="76" dy="0" fill="#FBBF24" font-weight="600">• Một bộ não LLM duy nhất gánh vác mọi việc:</tspan>
      <tspan x="96" dy="22">Vừa lập kế hoạch, vừa đọc file, vừa sửa code, vừa chạy test.</tspan>
      <tspan x="76" dy="26" fill="#FBBF24" font-weight="600">• Ưu điểm nổi bật:</tspan>
      <tspan x="96" dy="22">Đơn giản, độ trễ thấp, không tốn chi phí đồng bộ liên agent.</tspan>
      <tspan x="76" dy="26" fill="#FBBF24" font-weight="600">• Nút thắt cổ chai (Bottleneck):</tspan>
      <tspan x="96" dy="22">Dễ cạn kiệt context window; không thể phân tán công việc song song.</tspan>
    </text>

    <rect x="76" y="475" width="528" height="100" rx="10" fill="#0B1120" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.3"/>
    <text x="96" y="502" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FBBF24">Đại diện &amp; Phạm vi phù hợp:</text>
    <text x="96" y="528" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="96" dy="0">Claude Code CLI, Cursor, GitHub Copilot Chat.</tspan>
      <tspan x="96" dy="20">Phù hợp tối ưu cho các tác vụ tập trung trong 1-3 file mã nguồn.</tspan>
    </text>

    <!-- Right: Multi-Agent Swarm -->
    <rect x="656" y="160" width="568" height="440" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="676" y="180" width="180" height="28" rx="6" fill="#075985" stroke="#38BDF8" stroke-width="1"/>
    <text x="766" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7DD3FC" text-anchor="middle">TRƯỜNG PHÁI 2</text>
    <text x="676" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="bold" fill="#F1F5F9">Multi-Agent Swarm (Đa Tác Tử)</text>

    <line x1="676" y1="260" x2="1204" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="676" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="676" dy="0" fill="#38BDF8" font-weight="600">• Phân vai chuyên biệt hóa mạng lưới tác tử:</tspan>
      <tspan x="696" dy="22">Lead Planner → Research Subagents → Execution Subagents.</tspan>
      <tspan x="676" dy="26" fill="#38BDF8" font-weight="600">• Thực thi song song (Parallel Dispatching):</tspan>
      <tspan x="696" dy="22">Cùng lúc rà soát 10 module độc lập mà không bị nghẽn ngữ cảnh.</tspan>
      <tspan x="676" dy="26" fill="#38BDF8" font-weight="600">• Cơ chế kiểm soát an toàn nghiêm ngặt:</tspan>
      <tspan x="696" dy="22">Planner phê duyệt kế hoạch trước khi cho phép Coder chạy lệnh.</tspan>
    </text>

    <rect x="676" y="475" width="528" height="100" rx="10" fill="#0B1120" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="696" y="502" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">Đại diện &amp; Phạm vi phù hợp:</text>
    <text x="696" y="528" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="696" dy="0">Google DeepMind Antigravity, CrewAI, Microsoft AutoGen.</tspan>
      <tspan x="696" dy="20">Phù hợp tối đa cho các hệ thống phần mềm doanh nghiệp quy mô lớn.</tspan>
    </text>
  </g>

  <!-- Footer Navigation -->
  <g id="footer-group" data-pptx-bounds="56 645 1168 30">
    <line x1="56" y1="635" x2="1224" y2="635" stroke="#1E293B" stroke-width="1"/>
    <text x="56" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748B">Phần II: Các mô hình AI Agent | 2.1 Phân loại kiến trúc Agent</text>
    <text x="1224" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="end">SLIDE 16 / 35</text>
  </g>
</svg>

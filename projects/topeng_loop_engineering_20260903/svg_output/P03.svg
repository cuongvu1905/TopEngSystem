    <text x="76" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="76" dy="0" fill="#F1F5F9" font-weight="600">• Lịch sử 5 giai đoạn SDLC (P05-P08)</tspan>
      <tspan x="96" dy="18">Waterfall → Agile → DevOps → AI Copilot</tspan>
      <tspan x="76" dy="24" fill="#F1F5F9" font-weight="600">• Khủng hoảng "Prompt &amp; Hope" (P09)</tspan>
      <tspan x="96" dy="18">Giới hạn của việc tương tác một lần</tspan>
      <tspan x="76" dy="24" fill="#F1F5F9" font-weight="600">• Định nghĩa &amp; Ralph Closed-Loop (P10-P11)</tspan>
      <tspan x="96" dy="18">Bản chất của vòng lặp phản hồi khép kín</tspan>
      <tspan x="76" dy="24" fill="#F1F5F9" font-weight="600">• Chu trình 6 bước &amp; 4 Nguyên lý (P12-P13)</tspan>
      <tspan x="96" dy="18">Goal, Verification, Self-healing, Artifacts</tspan>
      <tspan x="76" dy="24" fill="#F1F5F9" font-weight="600">• So sánh Human vs Autonomous (P14)</tspan>
    </text>


    <line x1="477" y1="255" x2="797" y2="255" stroke="#334155" stroke-width="1"/>

    <text x="477" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="477" dy="0" fill="#F1F5F9" font-weight="600">• Kiến trúc Single vs Multi-Agent (P16)</tspan>
      <tspan x="497" dy="18">So sánh ưu nhược điểm kiến trúc</tspan>
      <tspan x="477" dy="24" fill="#F1F5F9" font-weight="600">• OpenAI Codex &amp; Operator (P17-P18)</tspan>
      <tspan x="497" dy="18">Function Calling &amp; Browser GUI Action</tspan>
      <tspan x="477" dy="24" fill="#F1F5F9" font-weight="600">• Anthropic Claude 3.7 (P19-P21)</tspan>
      <tspan x="497" dy="18">Extended Thinking, Computer Use &amp; CLI</tspan>
      <tspan x="477" dy="24" fill="#F1F5F9" font-weight="600">• DeepMind Antigravity (P22-P23)</tspan>
      <tspan x="497" dy="18">Planning Mode, Superpowers &amp; MCP</tspan>
      <tspan x="477" dy="24" fill="#F1F5F9" font-weight="600">• So sánh chuyên sâu &amp; Ma trận (P24-P26)</tspan>
    </text>


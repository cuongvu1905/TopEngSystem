    <text x="879" y="285" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#94A3B8">
      <tspan x="879" dy="0" fill="#F1F5F9" font-weight="600">• Bối cảnh &amp; Thách thức thực tế (P28)</tspan>
      <tspan x="899" dy="18">Bài toán quản trị dự án cơ điện TOPV</tspan>
      <tspan x="879" dy="24" fill="#F1F5F9" font-weight="600">• Kiến trúc As-Is 3 Tầng (P29-P30)</tspan>
      <tspan x="899" dy="18">UI Context → Multi-Brain Gateway</tspan>
      <tspan x="879" dy="24" fill="#F1F5F9" font-weight="600">• Tool Plugins &amp; n8n Engine (P31-P32)</tspan>
      <tspan x="899" dy="18">Booking, Task DB &amp; Báo cáo ngày tự động</tspan>
      <tspan x="879" dy="24" fill="#F1F5F9" font-weight="600">• Đánh giá năng suất thực chiến (P33)</tspan>
      <tspan x="879" dy="24" fill="#F1F5F9" font-weight="600">• Lộ trình 4 Trụ cột 2026-2027 &amp; Q&amp;A (P34-P35)</tspan>
    </text>

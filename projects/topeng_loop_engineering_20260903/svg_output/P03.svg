    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Hành trình 3 phần: Từ lý luận tiến hóa kỹ nghệ đến đối sánh công nghệ và thực thi doanh nghiệp</text>

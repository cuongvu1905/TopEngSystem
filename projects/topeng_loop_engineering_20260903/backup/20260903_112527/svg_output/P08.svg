<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Page Header -->
  <g id="header-group" data-pptx-bounds="56 40 1168 100">
    <rect x="56" y="40" width="220" height="26" rx="13" fill="#1E293B" stroke="#818CF8" stroke-width="1"/>
    <text x="166" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#818CF8" text-anchor="middle">PHẦN II: CÁC MÔ HÌNH AI AGENT</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">MA TRẬN ĐỐI SÁNH NĂNG LỰC KỸ THUẬT</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Đánh giá trực quan trên 5 tiêu chí kỹ nghệ tự chủ hàng đầu</text>
  </g>

  <!-- Comparison Matrix Table -->
  <g id="matrix-table" data-pptx-bounds="56 160 1168 360">
    <rect x="56" y="160" width="1168" height="350" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>

    <!-- Table Header Row -->
    <rect x="56" y="160" width="1168" height="52" rx="14" fill="#0B1120"/>
    <text x="80" y="193" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#94A3B8">TIÊU CHÍ KỸ THUẬT</text>
    <text x="320" y="193" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#10B981">OPENAI CODEX / OPERATOR</text>
    <text x="620" y="193" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#F59E0B">CLAUDE 3.7 SONNET</text>
    <text x="920" y="193" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#38BDF8">DEEPMIND ANTIGRAVITY</text>

    <!-- Divider -->
    <line x1="56" y1="212" x2="1224" y2="212" stroke="#334155" stroke-width="1"/>

    <!-- Row 1: Suy luận logic (Reasoning) -->
    <text x="80" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">1. Suy luận Logic &amp; Planning</text>
    <text x="320" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">Rất tốt (Fast / Function Calls)</text>
    <text x="620" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FBBF24">★★★ Xuất sắc (Extended Thinking)</text>
    <text x="920" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">★★★ Xuất sắc (Planning Mode)</text>
    <line x1="56" y1="272" x2="1224" y2="272" stroke="#1E293B" stroke-width="1"/>

    <!-- Row 2: Tương tác Môi trường (Environment) -->
    <text x="80" y="306" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">2. Tương tác Môi trường / OS</text>
    <text x="320" y="306" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#34D399">★★☆ Web DOM &amp; HTTP APIs</text>
    <text x="620" y="306" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FBBF24">★★★ Computer Use &amp; CLI</text>
    <text x="920" y="306" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">★★★ Shell, Terminal &amp; MCP</text>
    <line x1="56" y1="328" x2="1224" y2="328" stroke="#1E293B" stroke-width="1"/>

    <!-- Row 3: Đa tác tử (Multi-Agent) -->
    <text x="80" y="362" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">3. Cơ chế Đa tác tử (Multi-Agent)</text>
    <text x="320" y="362" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">★☆☆ Single-Agent / Thread API</text>
    <text x="620" y="362" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">★★☆ Single-Agent với Sub-tools</text>
    <text x="920" y="362" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">★★★ Native Parallel Sub-Agents</text>
    <line x1="56" y1="384" x2="1224" y2="384" stroke="#1E293B" stroke-width="1"/>

    <!-- Row 4: Kiểm chứng & An toàn (Verification) -->
    <text x="80" y="418" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">4. Kiểm chứng &amp; Quản trị An toàn</text>
    <text x="320" y="418" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">System Prompt &amp; Policy</text>
    <text x="620" y="418" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#FBBF24">Constitutional AI &amp; Caution</text>
    <text x="920" y="418" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">★★★ Verification-First &amp; Locks</text>
    <line x1="56" y1="440" x2="1224" y2="440" stroke="#1E293B" stroke-width="1"/>

    <!-- Row 5: Ứng dụng then chốt -->
    <text x="80" y="474" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#F1F5F9">5. Điểm nhấn Ứng dụng</text>
    <text x="320" y="474" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#10B981">Tự động hóa tác vụ Web / SaaS</text>
    <text x="620" y="474" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#F59E0B">Kỹ sư lập trình cá nhân cao cấp</text>
    <text x="920" y="474" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#38BDF8">Kỹ nghệ tự chủ hệ thống doanh nghiệp</text>
  </g>

  <!-- Key Takeaway Banner -->
  <g id="takeaway-banner" data-pptx-bounds="56 530 1168 95">
    <rect x="56" y="530" width="1168" height="90" rx="12" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
    <text x="80" y="555" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#818CF8">CHIẾN LƯỢC CÔNG NGHỆ TOPVSYSTEM:</text>
    <text x="80" y="580" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F5F9">
      <tspan x="80" dy="0">Không phụ thuộc vào một nhà cung cấp — Kiến trúc <tspan fill="#38BDF8" font-weight="bold">Dynamic Multi-Brain</tspan> kết hợp linh hoạt</tspan>
      <tspan x="80" dy="22">tư duy của Claude, API của Codex và kỷ luật tự chủ an toàn của Antigravity.</tspan>
    </text>
  </g>

  <!-- Footer Navigation -->
  <g id="footer-group" data-pptx-bounds="56 645 1168 30">
    <line x1="56" y1="635" x2="1224" y2="635" stroke="#1E293B" stroke-width="1"/>
    <text x="56" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748B">Phần II: Các mô hình AI Agent | 2.3 Ma trận so sánh</text>
    <text x="1224" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="end">SLIDE 08 / 12</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Page Header -->
  <g id="header-group" data-pptx-bounds="56 40 1168 100">
    <rect x="56" y="40" width="230" height="26" rx="13" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="171" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">PHẦN III: AI CHAT TOPVSYSTEM</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">KIẾN TRÚC AI CHAT HIỆN TẠI (AS-IS)</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Mô hình Dynamic Multi-Brain kết hợp True Tool Calling Plugins và n8n Webhook</text>
  </g>

  <!-- 3 Layer Horizontal Architecture Stack -->
  <g id="architecture-stack" data-pptx-bounds="56 160 1168 450">
    <!-- Layer 1: Context & UI -->
    <rect x="56" y="160" width="1168" height="130" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="76" y="175" width="230" height="28" rx="6" fill="#075985"/>
    <text x="191" y="194" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#38BDF8" text-anchor="middle">LỚP 1: GIAO DIỆN &amp; NGỮ CẢNH</text>
    <text x="325" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#F1F5F9">TopEngManager Chat Interface &amp; Real-time Context Provider</text>

    <!-- Sub elements -->
    <g transform="translate(76, 215)">
      <rect x="0" y="0" width="350" height="55" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#38BDF8">Nhận diện Hồ sơ Người dùng</text>
      <text x="15" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">Name, Email, Role (Admin/Staff), Phòng ban</text>

      <rect x="370" y="0" width="350" height="55" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1"/>
      <text x="385" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#38BDF8">Nhận thức Thời gian thực</text>
      <text x="385" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">Lịch thứ/ngày/giờ hệ thống, ngữ cảnh lịch họp</text>

      <rect x="740" y="0" width="370" height="55" rx="8" fill="#0B1120" stroke="#334155" stroke-width="1"/>
      <text x="755" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#38BDF8">Hỗ trợ Đa ngôn ngữ (Strict)</text>
      <text x="755" y="44" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">Tự động nhận diện &amp; phản hồi Tiếng Việt, En, Ko, Zh, Ja</text>
    </g>

    <!-- Layer 2: Dynamic Multi-Brain Gateway -->
    <rect x="56" y="305" width="1168" height="135" rx="14" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="76" y="320" width="250" height="28" rx="6" fill="#3730A3"/>
    <text x="201" y="339" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#A5B4FC" text-anchor="middle">LỚP 2: ĐIỀU PHỐI ĐA NÃO (MULTI-BRAIN)</text>
    <text x="345" y="340" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#F1F5F9">Dynamic AI Model Router &amp; Failover Gateway</text>

    <!-- Model Nodes -->
    <g transform="translate(76, 360)">
      <rect x="0" y="0" width="210" height="60" rx="8" fill="#0B1120" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#34D399">DeepSeek Harness</text>
      <text x="15" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">Local Reasoning &amp; Low-latency</text>

      <rect x="225" y="0" width="210" height="60" rx="8" fill="#0B1120" stroke="#38BDF8" stroke-width="1"/>
      <text x="240" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">9Router AI Gateway</text>
      <text x="240" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">Tối ưu hóa proxy &amp; tải mạng</text>

      <rect x="450" y="0" width="210" height="60" rx="8" fill="#0B1120" stroke="#60A5FA" stroke-width="1"/>
      <text x="465" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#60A5FA">Google Gemini 3.7</text>
      <text x="465" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">Flash Multi-modal tốc độ cao</text>

      <rect x="675" y="0" width="210" height="60" rx="8" fill="#0B1120" stroke="#F59E0B" stroke-width="1"/>
      <text x="690" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FBBF24">Anthropic Claude</text>
      <text x="690" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">Logic lập trình chuyên sâu</text>

      <rect x="900" y="0" width="210" height="60" rx="8" fill="#0B1120" stroke="#10B981" stroke-width="1"/>
      <text x="915" y="24" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#34D399">OpenAI GPT-4o</text>
      <text x="915" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">Function calling đa tác vụ</text>
    </g>

    <!-- Layer 3: Enterprise Plugins & Automation -->
    <rect x="56" y="455" width="1168" height="145" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="76" y="470" width="250" height="28" rx="6" fill="#064E3B"/>
    <text x="201" y="489" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#34D399" text-anchor="middle">LỚP 3: ENTERPRISE AGENT PLUGINS</text>
    <text x="345" y="490" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#F1F5F9">Thực thi hành động nghiệp vụ thật &amp; n8n Automation</text>

    <!-- Plugin Cards -->
    <g transform="translate(76, 510)">
      <rect x="0" y="0" width="265" height="70" rx="8" fill="#0B1120" stroke="#10B981" stroke-width="1"/>
      <text x="15" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981">roomBookingPlugin</text>
      <text x="15" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">
        <tspan x="15" dy="0">Đặt phòng, hủy phòng,</tspan>
        <tspan x="15" dy="16">kiểm tra phòng họp còn trống.</tspan>
      </text>

      <rect x="280" y="0" width="265" height="70" rx="8" fill="#0B1120" stroke="#38BDF8" stroke-width="1"/>
      <text x="295" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">taskPlugin</text>
      <text x="295" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">
        <tspan x="295" dy="0">list_my_tasks, create_task,</tspan>
        <tspan x="295" dy="16">đồng bộ trực tiếp MySQL DB.</tspan>
      </text>

      <rect x="560" y="0" width="265" height="70" rx="8" fill="#0B1120" stroke="#F59E0B" stroke-width="1"/>
      <text x="575" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#FBBF24">dailyReportPlugin</text>
      <text x="575" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">
        <tspan x="575" dy="0">generate_daily_report,</tspan>
        <tspan x="575" dy="16">tự tổng hợp tiến độ từ hệ thống.</tspan>
      </text>

      <rect x="840" y="0" width="270" height="70" rx="8" fill="#0B1120" stroke="#EC4899" stroke-width="1"/>
      <text x="855" y="25" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#F472B6">n8n Webhook Engine</text>
      <text x="855" y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#94A3B8">
        <tspan x="855" dy="0">Trigger tự động hóa thông báo</tspan>
        <tspan x="855" dy="16">Email, Zalo, Telegram tức thời.</tspan>
      </text>
    </g>
  </g>

  <!-- Footer Navigation -->
  <g id="footer-group" data-pptx-bounds="56 645 1168 30">
    <line x1="56" y1="635" x2="1224" y2="635" stroke="#1E293B" stroke-width="1"/>
    <text x="56" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748B">Phần III: AI Chat TOPVSystem | 3.1 Kiến trúc hiện tại</text>
    <text x="1224" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="end">SLIDE 09 / 12</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="loopNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Page Header -->
  <g id="header-group" data-pptx-bounds="56 40 1168 100">
    <rect x="56" y="40" width="220" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="166" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">PHẦN I: LOOP ENGINEERING</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">LOOP ENGINEERING LÀ GÌ VÀ LÀM GÌ?</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Bản chất của kỹ thuật vòng lặp phản hồi khép kín (Closed-Loop Autonomous Engineering)</text>
  </g>

  <!-- Left Column: Định nghĩa & Khái niệm -->
  <g id="left-concept-col" data-pptx-bounds="56 160 360 450">
    <rect x="56" y="160" width="360" height="440" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="76" y="180" width="130" height="28" rx="6" fill="#0B1120" stroke="#38BDF8" stroke-width="1"/>
    <text x="141" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#38BDF8" text-anchor="middle">KHÁI NIỆM CỐT LÕI</text>

    <text x="76" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Loop Engineering là gì?</text>
    <text x="76" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="76" dy="0">Là phương pháp luận kiến trúc trong đó</tspan>
      <tspan x="76" dy="22">AI Agent hoạt động theo các vòng lặp phản hồi</tspan>
      <tspan x="76" dy="22">khép kín không ngừng nghỉ cho đến khi</tspan>
      <tspan x="76" dy="22">đạt mục tiêu kỹ thuật được giao.</tspan>
    </text>

    <line x1="76" y1="365" x2="396" y2="365" stroke="#334155" stroke-width="1"/>

    <text x="76" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#38BDF8">Đặc trưng then chốt:</text>
    <text x="76" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F5F9">
      <tspan x="76" dy="0">• Không "Prompt-and-Forget":</tspan>
      <tspan x="96" dy="20" fill="#94A3B8">Agent tự chạy lệnh, tự kiểm tra mã.</tspan>
      <tspan x="76" dy="28" fill="#F1F5F9">• Khả năng tương tác môi trường:</tspan>
      <tspan x="96" dy="20" fill="#94A3B8">Truy cập Shell, linter, tests, file system.</tspan>
      <tspan x="76" dy="28" fill="#F1F5F9">• Giữ ngữ cảnh bền vững (Artifacts):</tspan>
      <tspan x="96" dy="20" fill="#94A3B8">Lưu giữ tài liệu kế hoạch, tránh lạc hướng.</tspan>
    </text>
  </g>

  <!-- Center Column: Visual Loop Diagram -->
  <g id="center-loop-col" data-pptx-bounds="436 160 408 450">
    <rect x="436" y="160" width="408" height="440" rx="16" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.3"/>
    <text x="640" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#818CF8" text-anchor="middle">CHU TRÌNH 6 BƯỚC KHÉP KÍN (CLOSED-LOOP)</text>

    <!-- Circular / Hexagonal Flow Nodes -->
    <!-- Node 1: Analyze -->
    <rect x="580" y="220" width="120" height="42" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="640" y="246" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">1. Phân Tích</text>

    <!-- Arrow 1->2 -->
    <path d="M 700 241 L 740 270" fill="none" stroke="#38BDF8" stroke-width="2"/>

    <!-- Node 2: Plan -->
    <rect x="710" y="280" width="115" height="42" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="767" y="306" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">2. Kế Hoạch</text>

    <!-- Arrow 2->3 -->
    <path d="M 767 325 L 767 375" fill="none" stroke="#6366F1" stroke-width="2"/>

    <!-- Node 3: Act/Code -->
    <rect x="710" y="380" width="115" height="42" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
    <text x="767" y="406" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#818CF8" text-anchor="middle">3. Thực Thi</text>

    <!-- Arrow 3->4 -->
    <path d="M 740 430 L 690 465" fill="none" stroke="#10B981" stroke-width="2"/>

    <!-- Node 4: Verify -->
    <rect x="580" y="460" width="120" height="42" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <text x="640" y="486" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">4. Kiểm Chứng</text>

    <!-- Arrow 4->5 -->
    <path d="M 580 481 L 530 450" fill="none" stroke="#F59E0B" stroke-width="2"/>

    <!-- Node 5: Observe Feedback -->
    <rect x="455" y="380" width="115" height="42" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="512" y="406" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#F59E0B" text-anchor="middle">5. Quan Sát</text>

    <!-- Arrow 5->6 -->
    <path d="M 512 375 L 512 325" fill="none" stroke="#EC4899" stroke-width="2"/>

    <!-- Node 6: Refine / Fix -->
    <rect x="455" y="280" width="115" height="42" rx="8" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
    <text x="512" y="306" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#EC4899" text-anchor="middle">6. Tự Sửa Lỗi</text>

    <!-- Arrow 6->1 -->
    <path d="M 540 270 L 580 241" fill="none" stroke="#38BDF8" stroke-width="2"/>

    <!-- Center Badge -->
    <circle cx="640" cy="355" r="46" fill="#0B1120" stroke="#6366F1" stroke-width="2"/>
    <text x="640" y="350" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold" fill="#94A3B8" text-anchor="middle">AUTONOMOUS</text>
    <text x="640" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="bold" fill="#38BDF8" text-anchor="middle">LOOP</text>

    <!-- Bottom summary status -->
    <rect x="475" y="530" width="330" height="38" rx="8" fill="#0B1120" stroke="#10B981" stroke-width="1"/>
    <text x="640" y="554" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">
      ✓ Lặp lại liên tục đến khi PASS 100% Tests
    </text>
  </g>

  <!-- Right Column: Giá trị thực tế & Loop làm gì -->
  <g id="right-value-col" data-pptx-bounds="864 160 360 450">
    <rect x="864" y="160" width="360" height="440" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
    <rect x="884" y="180" width="130" height="28" rx="6" fill="#0B1120" stroke="#10B981" stroke-width="1"/>
    <text x="949" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#10B981" text-anchor="middle">GIÁ TRỊ THỰC THI</text>

    <text x="884" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Loop Engineering làm gì?</text>
    <text x="884" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="884" dy="0">Thay thế sức người trong các vòng lặp lặp đi</tspan>
      <tspan x="884" dy="22">lặp lại: code → test → đọc lỗi → fix lỗi,</tspan>
      <tspan x="884" dy="22">giúp giải quyết trọn vẹn một tính năng từ</tspan>
      <tspan x="884" dy="22">đầu đến cuối (End-to-End Task Resolution).</tspan>
    </text>

    <line x1="884" y1="365" x2="1204" y2="365" stroke="#334155" stroke-width="1"/>

    <text x="884" y="400" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#10B981">Kết quả đo lường được:</text>
    <text x="884" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F5F9">
      <tspan x="884" dy="0">• Tăng tốc độ giải quyết lỗi x5 - x10 lần</tspan>
      <tspan x="884" dy="26">• Giảm 85% lỗi do bất cẩn của con người</tspan>
      <tspan x="884" dy="26">• Kiểm chứng thực tế trước khi Merge code</tspan>
      <tspan x="884" dy="26">• Kỹ sư tập trung vào thiết kế kiến trúc cao cấp</tspan>
    </text>
  </g>

  <!-- Footer Navigation -->
  <g id="footer-group" data-pptx-bounds="56 645 1168 30">
    <line x1="56" y1="635" x2="1224" y2="635" stroke="#1E293B" stroke-width="1"/>
    <text x="56" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748B">Phần I: Loop Engineering | 1.2 Khái niệm &amp; Cơ chế</text>
    <text x="1224" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="end">SLIDE 04 / 12</text>
  </g>
</svg>

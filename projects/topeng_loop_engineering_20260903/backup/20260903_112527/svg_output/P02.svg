<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="toc">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Page Header -->
  <g id="header-group" data-pptx-bounds="56 40 1168 100">
    <rect x="56" y="40" width="120" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="116" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">MỤC LỤC</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">CẤU TRÚC BÀI BÁO CÁO CHUYÊN ĐỀ</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Lộ trình 3 phần: Từ lý luận kỹ nghệ phần mềm đến đối sánh công nghệ và thực thi tại TOPVSystem</text>
  </g>

  <!-- 3 Sections Cards Layout -->
  <g id="agenda-cards" data-pptx-bounds="56 160 1168 450">
    <!-- Card 1 -->
    <rect x="56" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="106" cy="210" r="24" fill="#0B1120" stroke="#38BDF8" stroke-width="2"/>
    <text x="106" y="217" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#38BDF8" text-anchor="middle">01</text>
    <text x="146" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#38BDF8">PHẦN MỘT</text>
    <text x="146" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Loop Engineering</text>

    <line x1="86" y1="260" x2="391" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="86" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#38BDF8">1.1. Lịch sử tiến hóa SDLC</text>
    <text x="86" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="86" dy="0">Từ Waterfall, Agile, DevOps đến</tspan>
      <tspan x="86" dy="20">AI Copilot và Vòng lặp tự chủ.</tspan>
    </text>

    <text x="86" y="375" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#38BDF8">1.2. Loop Engineering là gì &amp; làm gì?</text>
    <text x="86" y="402" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="86" dy="0">Bản chất vòng lặp phản hồi khép kín</tspan>
      <tspan x="86" dy="20">(Closed-Loop): Analyze-Plan-Act-Verify.</tspan>
    </text>

    <text x="86" y="455" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#38BDF8">1.3. 4 Nguyên lý cốt lõi</text>
    <text x="86" y="482" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="86" dy="0">Goal-driven, Verification-first,</tspan>
      <tspan x="86" dy="20">Self-healing &amp; Persistent Artifacts.</tspan>
    </text>

    <rect x="86" y="535" width="305" height="36" rx="8" fill="#0B1120" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="238" y="558" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#38BDF8" text-anchor="middle">Thời lượng: ~10 - 12 Phút</text>

    <!-- Card 2 -->
    <rect x="457" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="507" cy="210" r="24" fill="#0B1120" stroke="#6366F1" stroke-width="2"/>
    <text x="507" y="217" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#818CF8" text-anchor="middle">02</text>
    <text x="547" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#818CF8">PHẦN HAI</text>
    <text x="547" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Mô Hình AI Agent</text>

    <line x1="487" y1="260" x2="792" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="487" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#818CF8">2.1. OpenAI Codex &amp; Operator</text>
    <text x="487" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="487" dy="0">Chuẩn hóa Function Calling &amp;</tspan>
      <tspan x="487" dy="20">Tự động thao tác trình duyệt web GUI.</tspan>
    </text>

    <text x="487" y="375" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#818CF8">2.2. Anthropic Claude 3.7</text>
    <text x="487" y="402" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="487" dy="0">Extended Thinking (Suy luận sâu) &amp;</tspan>
      <tspan x="487" dy="20">Computer Use OS API / Claude Code.</tspan>
    </text>

    <text x="487" y="455" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#818CF8">2.3. Google DeepMind Antigravity</text>
    <text x="487" y="482" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="487" dy="0">Multi-Agent, Planning Governance,</tspan>
      <tspan x="487" dy="20">MCP Tools &amp; Khung Superpowers.</tspan>
    </text>

    <rect x="487" y="535" width="305" height="36" rx="8" fill="#0B1120" stroke="#6366F1" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="639" y="558" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#818CF8" text-anchor="middle">Thời lượng: ~12 - 15 Phút</text>

    <!-- Card 3 -->
    <rect x="859" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="909" cy="210" r="24" fill="#0B1120" stroke="#10B981" stroke-width="2"/>
    <text x="909" y="217" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="bold" fill="#10B981" text-anchor="middle">03</text>
    <text x="949" y="205" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#10B981">PHẦN BA</text>
    <text x="949" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">AI Chat TOPVSystem</text>

    <line x1="889" y1="260" x2="1194" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="889" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#10B981">3.1. Hiện trạng (As-Is Architecture)</text>
    <text x="889" y="322" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="889" dy="0">Dynamic Multi-Brain, Tool Plugins</tspan>
      <tspan x="889" dy="20">(Booking, Task, Report) &amp; n8n Webhook.</tspan>
    </text>

    <text x="889" y="375" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#10B981">3.2. Trải nghiệm nghiệp vụ thực tế</text>
    <text x="889" y="402" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="889" dy="0">Tự động đặt phòng, phân loại task và</tspan>
      <tspan x="889" dy="20">xuất báo cáo ngày tức thì từ Database.</tspan>
    </text>

    <text x="889" y="455" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="bold" fill="#10B981">3.3. Lộ trình tương lai (Roadmap)</text>
    <text x="889" y="482" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="889" dy="0">4 Trụ cột: RAG bản vẽ, Multi-Agent</tspan>
      <tspan x="889" dy="20">giám sát, Voice AI &amp; ERP/MES thông minh.</tspan>
    </text>

    <rect x="889" y="535" width="305" height="36" rx="8" fill="#0B1120" stroke="#10B981" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="1041" y="558" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">Thời lượng: ~10 - 15 Phút</text>
  </g>

  <!-- Footer Navigation -->
  <g id="footer-group" data-pptx-bounds="56 645 1168 30">

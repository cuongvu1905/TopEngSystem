<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Page Header -->
  <g id="header-group" data-pptx-bounds="56 40 1168 100">
    <rect x="56" y="40" width="250" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="181" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">PHẦN II: CÁC MÔ HÌNH AI AGENT</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">DEEPMIND ANTIGRAVITY: MULTI-AGENT SWARM &amp; GOVERNANCE</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Kiến trúc điều phối bầy đàn tác tử kết hợp kỷ luật lập kế hoạch và phê duyệt an toàn</text>
  </g>

  <!-- 3 Analysis Panels -->
  <g id="antigravity-panels" data-pptx-bounds="56 160 1168 450">
    <!-- Panel 1 -->
    <rect x="56" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="76" y="180" width="160" height="28" rx="6" fill="#075985" stroke="#38BDF8" stroke-width="1"/>
    <text x="156" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7DD3FC" text-anchor="middle">MULTI-AGENT SWARM</text>
    <text x="76" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Điều Phối Đa Tác Tử</text>

    <line x1="76" y1="260" x2="396" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="76" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="76" dy="0" fill="#38BDF8" font-weight="600">• Phân nhánh sub-agents linh hoạt:</tspan>
      <tspan x="96" dy="20">Khởi chạy tác tử chuyên trách: research, self.</tspan>
      <tspan x="76" dy="28" fill="#38BDF8" font-weight="600">• Xử lý song song không nghẽn RAM:</tspan>
      <tspan x="96" dy="20">Nhiều agent cùng rà soát lỗi mà không làm tràn context.</tspan>
      <tspan x="76" dy="28" fill="#38BDF8" font-weight="600">• Giao tiếp bất đồng bộ (Reactive):</tspan>
      <tspan x="96" dy="20">Hệ thống tự đánh thức khi sub-agent gửi kết quả.</tspan>
    </text>

    <!-- Panel 2 -->
    <rect x="457" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="477" y="180" width="160" height="28" rx="6" fill="#3730A3" stroke="#6366F1" stroke-width="1"/>
    <text x="557" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#A5B4FC" text-anchor="middle">PLANNING GOVERNANCE</text>
    <text x="477" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Cơ Chế Khóa An Toàn</text>

    <line x1="477" y1="260" x2="797" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="477" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="477" dy="0" fill="#818CF8" font-weight="600">• Tách biệt Plan vs Execute:</tspan>
      <tspan x="497" dy="20">Tuyệt đối cấm can thiệp mã khi đang nghiên cứu.</tspan>
      <tspan x="477" dy="28" fill="#818CF8" font-weight="600">• Implementation Plan bắt buộc:</tspan>
      <tspan x="497" dy="20">Phải trình bày đầy đủ rủi ro, phương án test trước khi làm.</tspan>
      <tspan x="477" dy="28" fill="#818CF8" font-weight="600">• Cổng phê duyệt của con người:</tspan>
      <tspan x="497" dy="20">Chỉ chuyển sang hành động khi người dùng bấm xác nhận.</tspan>
    </text>

    <!-- Panel 3 -->
    <rect x="859" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="879" y="180" width="160" height="28" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="959" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#34D399" text-anchor="middle">PERSISTENT ARTIFACTS</text>
    <text x="879" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Bộ Nhớ Ngữ Cảnh Bền Vững</text>

    <line x1="879" y1="260" x2="1199" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="879" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="879" dy="0" fill="#34D399" font-weight="600">• Lưu kế hoạch vào file disk:</tspan>
      <tspan x="899" dy="20">Tránh mất trí nhớ sau nhiều giờ</tspan>
      <tspan x="899" dy="20">thực thi các tác vụ phức tạp.</tspan>
      <tspan x="879" dy="26" fill="#34D399" font-weight="600">• Báo cáo Walkthrough chuẩn mực:</tspan>
      <tspan x="899" dy="20">Tổng hợp những gì đã làm,</tspan>
      <tspan x="899" dy="20">đã test kèm bằng chứng log thật.</tspan>
      <tspan x="879" dy="26" fill="#34D399" font-weight="600">• Minh bạch qua Transcript JSONL:</tspan>
      <tspan x="899" dy="20">Mọi lệnh gọi tool đều có thể</tspan>
      <tspan x="899" dy="20">truy vết phục vụ kiểm toán.</tspan>
    </text>
  </g>

  <!-- Footer Navigation -->
  <g id="footer-group" data-pptx-bounds="56 645 1168 30">
    <line x1="56" y1="635" x2="1224" y2="635" stroke="#1E293B" stroke-width="1"/>
    <text x="56" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748B">Phần II: Các mô hình AI Agent | 2.7 Google DeepMind Antigravity</text>
    <text x="1224" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="end">SLIDE 22 / 35</text>
  </g>
</svg>

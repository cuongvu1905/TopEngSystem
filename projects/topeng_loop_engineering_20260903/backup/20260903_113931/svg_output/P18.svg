<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Page Header -->
  <g id="header-group" data-pptx-bounds="56 40 1168 100">
    <rect x="56" y="40" width="230" height="26" rx="13" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="171" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#10B981" text-anchor="middle">PHẦN II: CÁC MÔ HÌNH AI AGENT</text>
    <text x="56" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#F1F5F9">OPENAI OPERATOR: TỰ ĐỘNG HÓA TRÌNH DUYỆT QUA GUI</text>
    <text x="56" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#94A3B8">Bước đột phá biến AI thành người dùng thực thụ thao tác trực tiếp trên giao diện web</text>
  </g>

  <!-- 3 Analysis Panels -->
  <g id="operator-panels" data-pptx-bounds="56 160 1168 450">
    <!-- Panel 1 -->
    <rect x="56" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="76" y="180" width="160" height="28" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="156" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#34D399" text-anchor="middle">CƠ CHẾ NHẬN THỨC</text>
    <text x="76" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Thị Giác &amp; DOM Web</text>

    <line x1="76" y1="260" x2="396" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="76" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="76" dy="0" fill="#34D399" font-weight="600">• Chụp ảnh màn hình (Screenshots):</tspan>
      <tspan x="96" dy="20">AI nhìn thấy trang web đúng như mắt người xem.</tspan>
      <tspan x="76" dy="28" fill="#34D399" font-weight="600">• Phân tích cây DOM kết hợp Vision:</tspan>
      <tspan x="96" dy="20">Xác định tọa độ pixel chính xác của nút bấm, ô text, bảng dữ liệu.</tspan>
      <tspan x="76" dy="28" fill="#34D399" font-weight="600">• Vượt qua giao diện động:</tspan>
      <tspan x="96" dy="20">Xử lý mượt mà pop-up, captcha đơn giản, cuộn trang vô tận.</tspan>
    </text>

    <!-- Panel 2 -->
    <rect x="457" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="477" y="180" width="160" height="28" rx="6" fill="#075985" stroke="#38BDF8" stroke-width="1"/>
    <text x="557" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7DD3FC" text-anchor="middle">HÀNH ĐỘNG THỰC THI</text>
    <text x="477" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Tác Vụ Tự Chủ End-to-End</text>

    <line x1="477" y1="260" x2="797" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="477" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="477" dy="0" fill="#38BDF8" font-weight="600">• Tự động hóa mua hàng &amp; Đặt vé:</tspan>
      <tspan x="497" dy="20">Tìm chuyến bay giá rẻ, so sánh khách sạn, điền form thanh toán.</tspan>
      <tspan x="477" dy="28" fill="#38BDF8" font-weight="600">• Khả năng tự sửa sai trên web:</tspan>
      <tspan x="497" dy="20">Nếu click nhầm nút hoặc trang báo lỗi đỏ, AI tự bấm quay lại thử cách khác.</tspan>
      <tspan x="477" dy="28" fill="#38BDF8" font-weight="600">• Giám sát bởi con người (HITL):</tspan>
      <tspan x="497" dy="20">Dừng lại yêu cầu con người bấm xác nhận ở các bước nhạy cảm (thanh toán tiền).</tspan>
    </text>

    <!-- Panel 3 -->
    <rect x="859" y="160" width="365" height="440" rx="16" fill="url(#cardGrad)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="879" y="180" width="160" height="28" rx="6" fill="#3730A3" stroke="#6366F1" stroke-width="1"/>
    <text x="959" y="199" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold" fill="#A5B4FC" text-anchor="middle">Ý NGHĨA DOANH NGHIỆP</text>
    <text x="879" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="bold" fill="#F1F5F9">Giải Phóng Legacy RPA</text>

    <line x1="879" y1="260" x2="1199" y2="260" stroke="#334155" stroke-width="1"/>

    <text x="879" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94A3B8">
      <tspan x="879" dy="0" fill="#818CF8" font-weight="600">• Kết nối hệ thống không có API:</tspan>
      <tspan x="899" dy="20">Thao tác trực tiếp phần mềm cũ</tspan>
      <tspan x="899" dy="20">hoặc cổng dịch vụ công qua web.</tspan>
      <tspan x="879" dy="26" fill="#818CF8" font-weight="600">• Thay thế RPA truyền thống:</tspan>
      <tspan x="899" dy="20">Không bị gãy kịch bản khi trang web</tspan>
      <tspan x="899" dy="20">thay đổi màu sắc hay vị trí nút.</tspan>
      <tspan x="879" dy="26" fill="#818CF8" font-weight="600">• Tiềm năng ứng dụng tại TOPV:</tspan>
      <tspan x="899" dy="20">Tự tra cứu hóa đơn điện tử</tspan>
      <tspan x="899" dy="20">và giá vật tư từ các sàn B2B.</tspan>
    </text>
  </g>

  <!-- Footer Navigation -->
  <g id="footer-group" data-pptx-bounds="56 645 1168 30">
    <line x1="56" y1="635" x2="1224" y2="635" stroke="#1E293B" stroke-width="1"/>
    <text x="56" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#64748B">Phần II: Các mô hình AI Agent | 2.3 OpenAI Operator</text>
    <text x="1224" y="660" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="end">SLIDE 18 / 35</text>
  </g>
</svg>
